name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Rename APK (eindeutiger Name je Build)
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Screenshotter-0.1.0-b${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Release mit direkt ladbarer APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Screenshotter 0.1.0 Build ${GITHUB_RUN_NUMBER}" \
            --notes "Branch: ${GITHUB_REF_NAME}, Commit: ${GITHUB_SHA::7}"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename dist/*.apk)" >> "$GITHUB_STEP_SUMMARY"
